name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      VERSION: 1.0.${{ github.run_number }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Prepare folders
        run: New-Item -ItemType Directory -Force logs, artifacts, ui-results, ui-results/screenshots | Out-Null

      - name: Screen resolution
        continue-on-error: true
        run: ./ci/set-resolution.ps1 *>&1 | Tee-Object logs/resolution.log

      - name: Web assets (editor, styles, KaTeX, Mermaid)
        run: |
          Push-Location web
          npm ci --no-audit --no-fund *>&1 | Tee-Object ../logs/web-build.log
          if ($LASTEXITCODE) { exit 1 }
          npm run build *>&1 | Tee-Object -Append ../logs/web-build.log
          if ($LASTEXITCODE) { exit 1 }
          npm test *>&1 | Tee-Object ../logs/web-tests.log
          if ($LASTEXITCODE) { exit 1 }
          Pop-Location

      - name: Build
        run: |
          dotnet build MdViewer.sln -c Release -p:Version=$env:VERSION *>&1 | Tee-Object logs/build.log
          if ($LASTEXITCODE) { exit 1 }

      - name: Unit tests
        run: |
          dotnet test tests/MdViewer.Core.Tests/MdViewer.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=unit-tests.trx" --logger "console;verbosity=normal" --results-directory ui-results/trx *>&1 | Tee-Object logs/unit-tests.log
          if ($LASTEXITCODE) { exit 1 }

      - name: Publish app (self-contained, win-x64)
        run: |
          dotnet publish src/MdViewer/MdViewer.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:VERSION -p:DebugType=none -o publish *>&1 | Tee-Object logs/publish.log
          if ($LASTEXITCODE) { exit 1 }
          if (!(Test-Path publish/wwwroot/page.html)) { Write-Error "wwwroot не попал в публикацию"; exit 1 }

      - name: Portable archive
        run: |
          Compress-Archive -Path publish/* -DestinationPath artifacts/MDViewer-portable.zip -CompressionLevel Optimal
          Get-Item artifacts/MDViewer-portable.zip | Format-List Name, Length

      - name: Installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress *>&1 | Tee-Object logs/installer.log }
          & $iscc "/DAppVersion=$env:VERSION" installer/MDViewer.iss *>&1 | Tee-Object -Append logs/installer.log
          if ($LASTEXITCODE) { exit 1 }
          Get-Item artifacts/MDViewer-Setup.exe | Format-List Name, Length

      - name: Installer smoke test (silent install and uninstall)
        run: |
          $p = Start-Process artifacts/MDViewer-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=assoc', '/LOG=logs\install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Установка завершилась с кодом $($p.ExitCode)"; exit 1 }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\MD Viewer\MDViewer.exe'
          if (!(Test-Path $exe)) { Write-Error "Не найден $exe"; exit 1 }
          $cmd = (Get-ItemProperty 'HKCU:\Software\Classes\MDViewer.Markdown\shell\open\command').'(default)'
          $md = (Get-ItemProperty 'HKCU:\Software\Classes\.md').'(default)'
          "Команда открытия: $cmd" | Tee-Object -Append logs/install-check.log
          "Связь .md: $md" | Tee-Object -Append logs/install-check.log
          if ($md -ne 'MDViewer.Markdown') { Write-Error "Связь .md не создана"; exit 1 }
          $un = Join-Path $env:LOCALAPPDATA 'Programs\MD Viewer\unins000.exe'
          $u = Start-Process $un -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 3
          "Удаление: код $($u.ExitCode), exe остался: $(Test-Path $exe)" | Tee-Object -Append logs/install-check.log

      - name: UI tests
        timeout-minutes: 40
        env:
          MDVIEWER_EXE: ${{ github.workspace }}\publish\MDViewer.exe
          MDVIEWER_TEST_OUT: ${{ github.workspace }}\ui-results
        run: |
          # Вывод — сразу в файл через cmd: дочерние процессы WebView2 не должны держать канал вывода шага.
          cmd /c "dotnet test tests\MdViewer.UiTests\MdViewer.UiTests.csproj -c Release --no-build --logger trx;LogFileName=ui-tests.trx --logger console;verbosity=normal --results-directory ui-results\trx --blame-hang-timeout 4m --blame-hang-dump-type none > logs\ui-tests.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content logs/ui-tests.log -Tail 60
          Get-Process MDViewer, msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if ($code) { exit 1 }

      - name: Exported HTML opened in Edge without internet (screenshot)
        if: always()
        continue-on-error: true
        run: |
          $html = Join-Path $env:GITHUB_WORKSPACE 'ui-results\export\all-features.html'
          if (Test-Path $html) {
            $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
            $out = Join-Path $env:GITHUB_WORKSPACE 'ui-results\screenshots\20-exported-html-in-edge.png'
            $uri = ([Uri]$html).AbsoluteUri
            Start-Process $edge -ArgumentList '--headless=new', '--disable-gpu', '--no-first-run', '--proxy-server=127.0.0.1:9', '--window-size=1100,4200', "--screenshot=$out", $uri -Wait
            Get-Item $out | Format-List Name, Length
          }

      - name: Publish results to branches
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./ci/publish-branches.ps1 -Status "${{ job.status }}"
